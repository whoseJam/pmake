<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Sort Visualization</title>
<style>
    body { margin: 0; padding: 0; background: #FDFBF7; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    svg { width: 100%; height: 100%; max-width: 2560px; max-height: 1440px; box-shadow: 0 0 50px rgba(0,0,0,0.05); background: #FDFBF7; }
    .bar { transition: fill 0.3s; }
    .text-en { font-size: 48px; fill: #023047; font-weight: 600; text-anchor: middle; opacity: 0; transition: opacity 0.5s; }
    .text-cn { font-size: 36px; fill: #555; font-weight: 400; text-anchor: middle; opacity: 0; transition: opacity 0.5s; }
    .title { font-size: 80px; fill: #023047; font-weight: 800; text-anchor: middle; letter-spacing: 4px; }
    .code-line { font-family: 'Consolas', monospace; font-size: 24px; fill: #888; text-anchor: start; opacity: 0.6; }
    .code-active { fill: #fb8500; font-weight: bold; opacity: 1; }
</style>
</head>
<body>
<div id="container">
    <svg id="stage" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid meet">
        <defs>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FDFBF7;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#F0F4F8;stop-opacity:1" />
            </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bg-grad)" />
        
        <!-- Background Elements -->
        <circle cx="200" cy="200" r="150" fill="#8ecae6" opacity="0.1" />
        <circle cx="2300" cy="1200" r="200" fill="#ffb703" opacity="0.1" />
        <rect x="2000" y="100" width="300" height="300" rx="40" transform="rotate(15 2150 250)" fill="#219ebc" opacity="0.05" />

        <text x="1280" y="150" class="title">BUBBLE SORT</text>
        <line x1="880" y1="180" x2="1680" y2="180" stroke="#fb8500" stroke-width="4" stroke-linecap="round" />

        <g id="bars-container"></g>
        <g id="indicators"></g>

        <!-- Subtitles -->
        <g transform="translate(1280, 1250)">
            <rect x="-600" y="-80" width="1200" height="160" rx="20" fill="white" fill-opacity="0.8" stroke="#eee" stroke-width="2" />
            <text id="sub-en" y="-10" class="text-en">Bubble Sort Algorithm</text>
            <text id="sub-cn" y="50" class="text-cn">冒泡排序算法</text>
        </g>

        <!-- Code Visualization -->
        <g transform="translate(1800, 400)" id="code-block" opacity="0">
            <rect x="-20" y="-20" width="500" height="400" rx="10" fill="white" stroke="#eee" stroke-width="2" />
            <text x="0" y="30" class="code-line" id="code-1">for i from 0 to N-1</text>
            <text x="40" y="80" class="code-line" id="code-2">for j from 0 to N-i-1</text>
            <text x="80" y="130" class="code-line" id="code-3">if A[j] > A[j+1]</text>
            <text x="120" y="180" class="code-line" id="code-4">swap(A[j], A[j+1])</text>
        </g>
    </svg>
</div>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');
const barsContainer = document.getElementById('bars-container');
const subEn = document.getElementById('sub-en');
const subCn = document.getElementById('sub-cn');
const codeBlock = document.getElementById('code-block');

const COLORS = {
    default: '#8ecae6',
    compare: '#ffb703',
    swap: '#fb8500',
    sorted: '#06d6a0',
    text: '#023047'
};

const DATA_SIZE = 12;
const MAX_VAL = 100;
let data = [];
let bars = [];

function createBar(val, index, total) {
    const width = 80;
    const gap = 40;
    const totalWidth = total * width + (total - 1) * gap;
    const startX = (2560 - totalWidth) / 2;
    const maxHeight = 600;
    const height = (val / MAX_VAL) * maxHeight;
    
    const x = startX + index * (width + gap);
    const y = 900 - height;

    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform', `translate(${x}, ${y})`);
    
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('width', width);
    rect.setAttribute('height', height);
    rect.setAttribute('rx', 10);
    rect.setAttribute('fill', COLORS.default);
    rect.setAttribute('class', 'bar');
    rect.setAttribute('filter', 'url(#glow)');

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', width / 2);
    text.setAttribute('y', -15);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', COLORS.text);
    text.setAttribute('font-size', '24px');
    text.setAttribute('font-weight', 'bold');
    text.textContent = val;

    g.appendChild(rect);
    g.appendChild(text);
    barsContainer.appendChild(g);
    
    return { g, rect, val, x, height };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function setSubtitle(en, cn, duration = 2000) {
    subEn.style.opacity = 0;
    subCn.style.opacity = 0;
    await sleep(500);
    subEn.textContent = en;
    subCn.textContent = cn;
    subEn.style.opacity = 1;
    subCn.style.opacity = 1;
    if (duration > 0) await sleep(duration);
}

async function highlightCode(lineId) {
    document.querySelectorAll('.code-line').forEach(el => el.classList.remove('code-active'));
    if (lineId) document.getElementById(lineId).classList.add('code-active');
}

async function swapBars(i, j) {
    const bar1 = bars[i];
    const bar2 = bars[j];
    
    const x1 = bar1.x;
    const x2 = bar2.x;

    bar1.g.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
    bar2.g.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';

    bar1.g.setAttribute('transform', `translate(${x2}, ${900 - bar1.height})`);
    bar2.g.setAttribute('transform', `translate(${x1}, ${900 - bar2.height})`);

    // Swap data in array
    bars[i] = bar2;
    bars[j] = bar1;
    bars[i].x = x1;
    bars[j].x = x2;

    await sleep(700);
}

async function init() {
    data = Array.from({length: DATA_SIZE}, () => Math.floor(Math.random() * 80) + 10);
    barsContainer.innerHTML = '';
    bars = data.map((v, i) => createBar(v, i, DATA_SIZE));
    
    await sleep(1000);
    await setSubtitle("Welcome to Bubble Sort Visualization", "欢迎来到冒泡排序可视化演示", 3000);
    
    await setSubtitle("Bubble Sort is a simple sorting algorithm", "冒泡排序是一种简单的排序算法", 3000);
    await setSubtitle("It repeatedly steps through the list, compares adjacent elements", "它重复地遍历列表，比较相邻的元素", 3000);
    await setSubtitle("And swaps them if they are in the wrong order", "如果它们的顺序错误，就交换它们", 3000);

    codeBlock.style.transition = 'opacity 1s';
    codeBlock.setAttribute('opacity', 1);

    await bubbleSort();

    await highlightCode(null);
    await setSubtitle("Sorting Completed!", "排序完成！", 3000);
    
    // Celebration animation
    bars.forEach((b, i) => {
        setTimeout(() => {
            b.rect.setAttribute('fill', '#ffd166');
            b.g.setAttribute('transform', `translate(${b.x}, ${900 - b.height - 20})`);
            setTimeout(() => {
                b.g.setAttribute('transform', `translate(${b.x}, ${900 - b.height})`);
            }, 200);
        }, i * 100);
    });
}

async function bubbleSort() {
    const n = bars.length;
    for (let i = 0; i < n - 1; i++) {
        await highlightCode('code-1');
        await setSubtitle(`Pass ${i + 1}: Bubbling up the largest element`, `第 ${i + 1} 轮：将最大的元素冒泡到末尾`, 1500);
        
        for (let j = 0; j < n - i - 1; j++) {
            await highlightCode('code-2');
            bars[j].rect.setAttribute('fill', COLORS.compare);
            bars[j+1].rect.setAttribute('fill', COLORS.compare);
            
            await setSubtitle(`Comparing ${bars[j].val} and ${bars[j+1].val}`, `比较 ${bars[j].val} 和 ${bars[j+1].val}`, 1000);
            
            await highlightCode('code-3');
            if (bars[j].val > bars[j+1].val) {
                await setSubtitle(`${bars[j].val} > ${bars[j+1].val}, Swap needed`, `${bars[j].val} > ${bars[j+1].val}，需要交换`, 1000);
                
                await highlightCode('code-4');
                bars[j].rect.setAttribute('fill', COLORS.swap);
                bars[j+1].rect.setAttribute('fill', COLORS.swap);
                await swapBars(j, j+1);
            } else {
                await setSubtitle(`${bars[j].val} <= ${bars[j+1].val}, No swap`, `${bars[j].val} <= ${bars[j+1].val}，无需交换`, 1000);
            }

            bars[j].rect.setAttribute('fill', COLORS.default);
            bars[j+1].rect.setAttribute('fill', COLORS.default);
        }
        
        bars[n - i - 1].rect.setAttribute('fill', COLORS.sorted);
        await setSubtitle(`Element ${bars[n - i - 1].val} is now sorted`, `元素 ${bars[n - i - 1].val} 现已排好序`, 1500);
    }
    bars[0].rect.setAttribute('fill', COLORS.sorted);
}

init();

</script>
</body>
</html>
