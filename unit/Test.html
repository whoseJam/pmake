<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pythagorean Theorem</title>
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#1e1e1e;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden}
#stage{width:80vmin;height:60vmin;max-width:800px}
.subs{margin-top:30px;text-align:center;height:80px;transition:opacity .5s}
.zh{font-size:1.6rem;margin-bottom:8px;color:#f0f0f0;font-weight:300;letter-spacing:1px}
.en{font-size:1rem;color:#888;font-style:italic}
path,rect,line{transition:stroke-dashoffset 1.5s ease-in-out, fill 1s ease, opacity 1s ease}
.path-draw{fill:transparent;stroke-width:0.8;stroke-dasharray:400;stroke-dashoffset:400}
.drawn{stroke-dashoffset:0}
.filled{fill-opacity:0.3}
text{font-family:'Times New Roman',serif;font-style:italic;fill:#fff;font-size:5px;text-anchor:middle;dominant-baseline:middle;opacity:0;transition:opacity 1s}
.show-text{opacity:1}
.highlight{fill-opacity:0.8 !important;filter:drop-shadow(0 0 5px currentColor)}
</style>
</head>
<body>
<svg id="stage" viewBox="-10 -20 130 130">
<!-- Squares -->
<path id="sq-b" d="M10 20 H40 V60 H10 Z" fill="#4ECDC4" stroke="#4ECDC4" class="path-draw"/>
<path id="sq-a" d="M40 60 H70 V90 H40 Z" fill="#FF6B6B" stroke="#FF6B6B" class="path-draw"/>
<path id="sq-c" d="M40 20 L80 -10 L110 30 L70 60 Z" fill="#FFE66D" stroke="#FFE66D" class="path-draw"/>

<!-- Triangle -->
<path id="tri" d="M40 20 L40 60 L70 60 Z" fill="none" stroke="#fff" class="path-draw" style="stroke-width:1"/>
<path id="right-angle" d="M40 55 H45 V60" fill="none" stroke="#fff" class="path-draw" style="stroke-width:0.5"/>

<!-- Labels -->
<text id="lbl-b" x="35" y="40" fill="#4ECDC4">b</text>
<text id="lbl-a" x="55" y="65" fill="#FF6B6B">a</text>
<text id="lbl-c" x="62" y="35" fill="#FFE66D">c</text>

<text id="area-b" x="25" y="40" font-size="6" fill="#4ECDC4" style="display:none">b²</text>
<text id="area-a" x="55" y="75" font-size="6" fill="#FF6B6B" style="display:none">a²</text>
<text id="area-c" x="75" y="25" font-size="6" fill="#FFE66D" style="display:none">c²</text>

<text id="formula" x="55" y="105" font-size="8" fill="#fff" style="font-style:normal">a² + b² = c²</text>
</svg>

<div class="subs">
<div class="zh" id="zh"></div>
<div class="en" id="en"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setSub = (z, e) => {
    $('zh').style.opacity = 0;
    $('en').style.opacity = 0;
    setTimeout(() => {
        $('zh').innerText = z;
        $('en').innerText = e;
        $('zh').style.opacity = 1;
        $('en').style.opacity = 1;
    }, 300);
};

async function play() {
    // Reset
    document.querySelectorAll('.path-draw').forEach(el => {
        el.classList.remove('drawn', 'filled', 'highlight');
        el.style.fillOpacity = 0;
    });
    document.querySelectorAll('text').forEach(el => el.classList.remove('show-text'));
    
    await sleep(500);

    // 1. Triangle
    setSub("这是一个直角三角形", "Consider a right-angled triangle.");
    $('tri').classList.add('drawn');
    await sleep(1500);
    $('right-angle').classList.add('drawn');
    await sleep(2000);

    // 2. Sides
    setSub("直角边 a 和 b", "The legs are labeled a and b.");
    $('lbl-a').classList.add('show-text');
    $('lbl-b').classList.add('show-text');
    await sleep(2000);
    
    setSub("斜边 c", "The hypotenuse is labeled c.");
    $('lbl-c').classList.add('show-text');
    await sleep(2000);

    // 3. Squares
    setSub("以各边为边长构建正方形", "Construct squares on each of the three sides.");
    $('sq-a').classList.add('drawn', 'filled');
    $('sq-a').style.fillOpacity = 0.2;
    await sleep(500);
    $('sq-b').classList.add('drawn', 'filled');
    $('sq-b').style.fillOpacity = 0.2;
    await sleep(500);
    $('sq-c').classList.add('drawn', 'filled');
    $('sq-c').style.fillOpacity = 0.2;
    
    // Switch labels to area
    $('lbl-a').style.display = 'none';
    $('lbl-b').style.display = 'none';
    $('lbl-c').style.display = 'none';
    $('area-a').style.display = 'block'; $('area-a').classList.add('show-text');
    $('area-b').style.display = 'block'; $('area-b').classList.add('show-text');
    $('area-c').style.display = 'block'; $('area-c').classList.add('show-text');
    await sleep(3000);

    // 4. Theorem
    setSub("直角边正方形面积之和", "The sum of the areas of the squares on the legs...");
    $('sq-a').classList.add('highlight');
    $('sq-b').classList.add('highlight');
    await sleep(2500);

    setSub("等于斜边正方形的面积", "...equals the area of the square on the hypotenuse.");
    $('sq-a').classList.remove('highlight');
    $('sq-b').classList.remove('highlight');
    $('sq-c').classList.add('highlight');
    await sleep(2500);

    setSub("这就是勾股定理", "This is the Pythagorean Theorem.");
    $('sq-c').classList.remove('highlight');
    $('sq-a').style.fillOpacity = 0.2;
    $('sq-b').style.fillOpacity = 0.2;
    $('sq-c').style.fillOpacity = 0.2;
    $('formula').classList.add('show-text');
}

play();
</script>
</body>
</html>
