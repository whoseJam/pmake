        <h1>Slim Span</h1>
        <p>最小差值生成树</p>
    </section>
    <section data-background-iframe="http://43.143.204.105/problem/1060" data-background-interactive>
    </section>
    <section>
        <h2>Slim Span</h2>
        <p>定义生成树的代价为 $边权最大值-边权最小值$，求在这种定义下的最小差值生成树</p>
    </section>
    <section>
        <h2>Slim Span</h2>
        <p>枚举生成树中边权最小的那条边，把它固定下来</p>
        <p class="fragment">现在想让差值最小，只需要让边权最大值最小就可以了</p>
        <p class="fragment">而这正是最小生成树的定义</p>
        <p class="fragment">所以我们先枚举最小边，再对每一种最小边做一个最小生成树即可</p>
        <p class="fragment">可以提前把 $m$ 条边排好序，避免每一次求最小生成树都要重新对边排序</p>
        <p class="fragment">时间复杂度 $O(mlogm+mn)$</p>
    </section>
</section>
