    <section>
        <h2>最小路径覆盖</h2>
        <p>给定一个DAG，求至少需要选出多少条路径，才能让DAG被完全覆盖</p>
        <iframe data-src="./animation/最小路径覆盖.html"
            style="width: 1000px; height: 400px;"></iframe>
        <p class="fragment quote">上图最小路径覆盖就是 $3$</p>
    </section>
    <section>
        <h2>最小路径覆盖</h2>
        <p>
            我们把DAG里面的每一个点 $u$，都拆为两个点 $A_u$ 和 $B_u$。
            如果存在一条有向边 $u\rightarrow v$，那么就连一条 $A_u\rightarrow B_v$ 的连边，这样就得到了一张二分图。
            那么 $最小路径覆盖=节点总数-二分图最大匹配数$
        </p>
    </section>
