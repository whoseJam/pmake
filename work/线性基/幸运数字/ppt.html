    <problem data-source="https://www.luogu.com.cn/problem/P3292"></problem>
    <section>
        <h2>幸运数字</h2>
        <p>有一个朴素的想法，处理一个倍增线性基数组</p>
    </section>
    <section>
        <h2>幸运数字</h2>
        <p>另一个想法是把前缀线性基推广到树上，对树上每个节点开一个线性基，形成一个线性基数组 $\{L_i\}$，每个节点的线性基在其父节点的线性基的基础上插入 $G_i$</p>
        <p class="fragment">在对每个线性基插入的时候，记录每个基向量来自哪个位置，尽量把深度更深的基向量保留下来</p>
        <p class="fragment">查询 $x\leftrightarrow y$ 的时候就取 $L_x$ 和 $L_y$ 这两个线性基中深度不小于 $d_{LCA(x,y)}$ 的基向量进行贪心</p>
    </section>
