    <problem data-src="http://43.143.204.105/problem/78"></problem>
    <section>
        <h2>灾后重建</h2>
        <p>给出所有边，按照时间顺序每次重建一个村庄</p>
        <p class="fragment">最短路只能经过被修建好的村庄</p>
        <p class="fragment">对每个时间点，求任意两点之间的最短路</p>
    </section>
    <section>
        <h2>灾后重建</h2>
        <p>发现每次恢复一个村庄，正好和Floyd算法中枚举 $k$ 这个中转点类似</p>
        <ul>
            <li class="fragment">Floyd枚举到第 $k$ 个中转点前，只允许最短路经过 $1,2...k-1$ 这些中转点</li>
            <li class="fragment">本题中如果村庄 $a_1,a_2...a_k-1$ 都被恢复了，在恢复 $a_k$ 这个村庄之前，也只允许最短路经过 $a_1,a_2...a_{k-1}$ 这些村庄</li>
        </ul>
        <codeblock class="fragment">
            <script type="text/template">
                // 恢复村庄 u，等价于允许它作为中转点
                void Recover(int u) {
                    for (int i = 0; i < n; i++)
                        for (int j = 0; j < n; j++)
                            d[i][j] = min(d[i][j], d[i][u] + d[u][j]);
                }
            </script>
        </codeblock>
    </section>
