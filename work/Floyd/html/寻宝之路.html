        <h2>寻宝之路</h2>
        <p>容易发现，题目要我们求：</p>
        <p>
            $$
            \sum_{i=1}^{m-1}[从 A_i 到 A_{i+1} 的最小危险指数]
            $$
        </p>
        <p class="fragment">而移动之间是相互独立的，我们只需要让每次移动的危险指数最小，总的危险指数自然也会最小</p>
        <p class="fragment">那用Floyd提前预处理出来任意两点之间的最小危险指数就行了</p>
