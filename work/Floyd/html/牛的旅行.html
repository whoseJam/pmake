        <h2>牛的旅行</h2>
        <p>设将要合并的两个连通块为 $A$ 和 $B$，新添加的边为 $(i,j)$，其中 $i\in A$ 且 $j\in B$，新连通块为 $S$</p>
        <p class="fragment">考虑连接 $(i,j)$ 后，$S$ 的直径可能是多少：</p>
        <ol>
            <li class="fragment">$A$ 连通块内的直径</li>
            <li class="fragment">$B$ 连通块内的直径</li>
            <li class="fragment">$A$ 中从 $i$ 出发能走出的最远距离 + $w(i,j)$ + $B$ 中从 $j$ 出发的最远距离 </li>
        </ol>
