    <problem data-src="http://43.143.204.105/problem/99"></problem>
    <section>
        <h2>干草捆盛宴</h2>
        <p>有一排 $n$ 个元素，第 $i$ 个元素有两个属性：风味 $F_i$ 和辣度 $S_i$</p>
        <p class="fragment">你需要找到一个区间 $[l,r]$，满足：</p>
        <ul>
            <li class="fragment">区间风味度之和至少为 $M$，即 $\sum_{l}^rF_i\ge M$</li>
            <li class="fragment">区间的<b>辣度最大值</b>越小越好</li>
        </ul>
    </section>
    <section>
        <h2>干草捆盛宴</h2>
        <p class="quote">在这个题目中对区间有两个要求，风味度之和要大于给定数字，辣度要尽可能小，我们能不能尝试先满足其中一个要求？</p>
        <p class="fragment quote">先尝试满足一下风味度之和的这个要求？</p>
    </section>
</section>
