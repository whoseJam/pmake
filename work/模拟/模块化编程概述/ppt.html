<section>
    <section>
        <h1>模块化编程</h1>
    </section>
    <section>
        <h2>模块化编程</h2>
        <p>认为一个庞大的任务是由很多小模块组成</p>
        <ul>
            <li class="fragment">让一个模块负责的功能尽量<b style="color: red;">“单一”</b></li>
            <li class="fragment">模块之间的<b style="color: purple;">“交流”</b>尽量少</li>
        </ul>
        <p class="fragment quote">“高内聚低耦合” 是软件开发中的重要设计原则，一个模块内的各个功能高度相关，模块之间相互依赖程度低，这种设计让软件结构更清晰，便于维护和扩展</p>
    </section>
    <section>
        <h2>例子</h2>
        <p>以一个例子，我们要实现对一个日期做 $n$ 次加法</p>
        <codeblock style="height: 505px;">
            <script type="text/template">
                int year, month, day, n;
                cin >> year >> month >> day >> n;
                for (int i = 1; i <= n; i++) {
                    day = day + 1;
                    if (month == 1 || month == 3 || ...) {
                        if (day == 31 + 1) {
                            month += 1;
                            day = 1;
                            if (month == 12 + 1) { ... }
                        }
                    } else if (month == 4 || month == 6 || ...) {
                        if (day == 30 + 1) {
                            month += 1;
                            day = 1;
                        }
                    } else if (month == 2) {
                        if (year % 400 == 0 || (year % 4 == 0 && year % 100 != 0)) {
                            if (day == 29 + 1) {
                                month += 1;
                                day = 1;
                            }
                        } else { ... }
                    }
                }
            </script>
        </codeblock>
    </section>
    <section>
        <h2>实现手段</h2>
        <p>使用普通函数，语义化命名</p>
        <codeblock>
            <script type="text/template">
                bool isLeapYear(int year) { ... }
                bool shouldNextMonth(int month, int day) { ... }
                bool shouldNextYear(int year, int month) { ... }
                void nextDay(int& year, int& month, int& day) {
                    day++;
                    if (shouldNextMonth(month, day)) { month++; day = 1; }
                    if (shouldNextYear(year, month)) { year++; month = 1; }
                }
                cin >> year >> month >> day >> n;
                while (n--) nextDay(year, month, day);
            </script>
        </codeblock>
    </section>
    <section>
        <h2>实现手段</h2>
        <p>使用结构体，把所有和该结构体有关的操作封装进去</p>
        <codeblock>
            <script type="text/template">
                struct Date {
                    int year, month, day;
                    void nextDay() {
                        ...
                    }
                }
                istream operator >> (istream in&, Date& date) {
                    cin >> date.year >> date.month >> date.day;
                    return in;
                }
                cin >> date >> n;
            </script>
        </codeblock>
    </section>
    <section>
        <h2>实现手段</h2>
        <p>使用命名空间封装</p>
        <codeblock>
            <script type="text/template">
                namespace DATE {
                    int month[12] = { ... }
                    bool shouldNextMonth(int month, int day) { ... }
                    bool shouldNextYear(int year, int month) { ... }
                    void nextDay(int& year, int& month, int& day) {
                        day++;
                        if (shouldNextMonth(month, day)) { month++; day = 1; }
                        if (shouldNextYear(year, month)) { year++; month = 1; }
                    }
                }
                using DATE::nextDay; // 只对外暴露有必要的部分，封装性更好
            </script>
        </codeblock>
    </section>
</section>
