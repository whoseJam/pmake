    </section>
    <section>
        <h2>求导</h2>
        <p>给定一个函数曲线 $f(x)$，我们希望知道其上过某个点切线的斜率</p>
        <p>取一个微小量 $\Delta x$，则 $x=x_0$ 的斜率可以被表示为：
            $$
            k=\frac{f(x_0+\Delta x)-f(x_0)}{\Delta x}
            $$
        </p>
        <p class="fragment">当 $\Delta x\rightarrow 0$ 时，$k$ 就可以被精确求出了</p>
    </section>
