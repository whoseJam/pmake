    <problem data-source="https://www.luogu.com.cn/problem/P10633"></problem>
    <section>
        <h2>数列</h2>
        <p>给定一个长度为 $n$ 的正整数数列 $a_i$</p>
        <p class="fragment">
            $$
            graze(x,y)=|x-y|+|a_x-a_y|
            $$
        </p>
        <p class="fragment">支持以下两种操作</p>
        <ul>
            <li class="fragment">Modify x k：将 $a_x$ 修改为 $k$</li>
            <li class="fragment">Query x k：查询<b style="color: red;">历史上</b>有多少个 $i$ 满足 $graze(x,i)\le k$</li>
        </ul>
    </section>
</section>
