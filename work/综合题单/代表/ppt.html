    <section>
        <h2>代表</h2>
        <p>定义一个特殊序列</p>
        <ul>
            <li class="fragment">$a_1=1$</li>
            <li class="fragment">$a_2=2$</li>
            <li class="fragment">奇数项 $a_n=2\times a_{n-1}$</li>
            <li class="fragment">偶数项 $a_n=a_{n-1}+r_{n-1}$</li>
        </ul>
        <p class="fragment">其中 $r_{n-1}=mex(\{|a_i-a_j|,1\le i\le j\le n-1\})$</p>
        <p class="fragment">定义 $repr(x)$ 是一个二元组 $(p,q)$，满足 $x=a_p-a_q$</p>
        <p class="fragment">给出 $x$，求 $repr(x)$</p>
        <p class="fragment quote">不妨先打表感受一下这个序列</p>
    </section>
