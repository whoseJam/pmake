<section>
    <section>
        <h1>积性函数</h1>
    </section>
    <section>
        <h2>积性函数</h2>
        <p>若一个函数 $f$ 满足：</p>
        <p>
            对于任意两个正整数 $a,b$，若 $gcd(a,b)=1$，则 $f(ab)=f(a)f(b)$
        </p>
        <p class="fragment">则 $f$ 是一个<b>积性函数</b></p>
    </section>
    <section>
        <h2>积性函数的重要性质</h2>
        <p>假设 $f$ 是一个积性函数</p>
        <p class="fragment">
            设 $N=p_1^{a_1}p_2^{a_2}...p_n^{a_n}$，则有：
            $$
            \begin{aligned}
            f(N)&=f(p_1^{a_1}p_2^{a_2}...p_n^{a_n}) \\
            &=f(p_1^{a_1})f(p_2^{a_2})...f(p_n^{a_n})
            \end{aligned}
            $$
        </p>
    </section>
</section>
