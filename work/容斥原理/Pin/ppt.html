    <section>
        <h2>Pin</h2>
        <p>我们想要直接计算恰好 $D$ 个位置不同的字符串的对数，时间复杂度势必是 $O(n^2)$</p>
        <codeblock>
            <script type="text/template">
                for (int i = 1; i <= n; i++) {
                    for (int j = i + 1; j <= n; j++) {
                        if (s[i] 和 s[j] 恰好 D 个位置不同) ans++;
                    }
                }
            </script>
        </codeblock>
        <p>能统计<b>至少 $D$ 个位置相同的字符串对数</b>吗？</p>
    </section>
    <section>
        <h2>至少 $D$ 个位置相同的字符串对数</h2>
        <div style="display: flex;">
            <iframe data-animation="./哈希统计.js"
                style="width: 40%; height: 500px;"></iframe>
            <div style="width: 60%;">
                <codeblock>
                    <script type="text/template">
                        int ans = 0;
                        for (mask) {
                            for (int i = 1; i <= n; i++) {
                                int hash = s[i] 在 mask 下的哈希值;
                                ans += count[hash];
                                count[hash]++;
                            }
                        }
                    </script>
                </codeblock>
            </div>
        </div>
    </section>
