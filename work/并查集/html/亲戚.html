    <section>
        <h2>亲戚</h2>
        <p>只需要在朴素并查集的基础上，对每一个集合，维护一个 $siz$ 用来表示集合的大小即可</p>
        <p class="fragment">在合并两个并查集的时候，同时注意更新 $siz$</p>
        <codeblock class="fragment">
            <script type="text/template">
                void Merge(int x, int y) {
                    int fx = GetFa(x), fy = GetFa(y);
                    if (fx != fy) {
                        fa[fx] = fy;
                        siz[fy] += siz[fx];
                    }
                }
            </script>
        </codeblock>
