    <section>
        <h2>筛法其二</h2>
        <p>定义最大质因子函数 $f(x)=x的最大质因子$，让你把 $[1,n]$ 的 $f$ 函数的值求出来</p>
        <ul>
            <li class="fragment">如果 $x$ 是质数，那么显然有 $f(x)=x$</li>
            <li class="fragment">如果 $x=i\times p_j$，那么 $f(x)=max\{f(i),p_j\}$</li>
        </ul>
        <codeblock class="fragment">
            <script type="text/template">
                void Sieve(int n) {
                    for (int i = 2; i <= n; i++) {
                        if (!vis[i]) {
                            prim[++tot] = i;
                            f[i] = i;
                        }
                        for (int j = 1; j <= tot && i * prim[j] <= n; j++) {
                            vis[i * prim[j]] = 1;
                            f[i * prim[j]] = max(f[i], prim[j]);
                            if (i % prim[j] == 0) break;
                        }
                    }
                }
            </script>
        </codeblock>
