        <h2>线性筛</h2>
        <p>线性筛的思路很简单，我只需要保证每个合数都能，且只能被自己的最小质因子筛去，那么每个合数就只会被筛掉一次了</p>
        <iframe data-animation="./线性筛.js" class="fragment"
            style="width: 1000px; height: 300px;"></iframe>
        <codeblock class="fragment" style="margin-top: -10px;">
            <script type="text/template">
                void Sieve(int n) {
                    for (int i = 2; i <= n; i++) {
                        if (!vis[i]) prim[++tot] = i;
                        for (int j = 1; j <= tot && i * prim[j] <= n; j++) {
                            vis[i * prim[j]] = 1;
                            if (i % prim[j] == 0) break;
                            // i*prim[j+t](t>0)一定能被(i/prim[j]*prim[j+t])*prim[j]筛掉
                        }
                    }
                }
            </script>
        </codeblock>
