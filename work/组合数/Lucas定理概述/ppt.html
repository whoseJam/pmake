    <section>
        <h1>Lucas定理</h1>
    </section>
    <section>
        <h2>Lucas定理</h2>
        <p>当 $P$ 是一个 $10^6$ 量级内的质数，我们想要计算 $C_n^m$ 对 $P$ 取模的结果时......</p>
        <p class="fragment">
            $$
            C_n^m \% P = C_{\lfloor n/P\rfloor}^{\lfloor m/P\rfloor}\times C_{n\% P}^{m\% P}\% P
            $$
        </p>
        <codeblock class="fragment">
            <script type="text/template">
                // 预处理阶乘逆元后，能直接返回上下标不超过 1e6 以内的组合数
                int C(int n, int m);
            </script>
        </codeblock>
        <codeblock class="fragment">
            <script type="text/template">
                int Lucas(int n, int m) {
                    if (n > m) return 0;
                    if (n == 0) return C(n, m);
                    return Lucas(n / P, m / P) * C(n % P, m % P) % P;
                }
            </script>
        </codeblock>
    </section>
</section>
