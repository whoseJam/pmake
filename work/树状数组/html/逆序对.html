        <h1>逆序对</h1>
    </section>
    <problem data-src="http://43.143.204.105/problem/845"></problem>
    <section>
        <h2>逆序对</h2>
        <p>逆序对需要满足：$i\lt j$ 且 $a_i\gt a_j$</p>
        <p>如果我们把坐标系看作一个横着的 $i$ 轴，一个竖着的 $a$ 轴</p>
        <iframe data-animation="./animation/逆序对.html" class="fragment"
            style="width: 1000px; height: 500px;"></iframe>
    </section>
    <section>
        <h2>逆序对</h2>
        <p>不过本题 $a$ 的范围很大</p>
        <p class="fragment">但我们统计逆序对时，看的是 $a$ 的相对大小</p>
        <p class="fragment">所以我们可以把范围在 $[1,10^9]$ 的 $a$，在保证相对大小不变的情况下，映射到 $[1,n]$，这个过程叫做<b>离散化</b></p>
        <p class="fragment">
            $$
            [4,199,45,20,7]\rightarrow [1,5,4,3,2]
            $$
        </p>
        <codeblock class="fragment">
            <script type="text/template">
                for (int i = 1; i <= n; i++)
                    Ls[++Lsn] = a[i];
                sort(Ls + 1, Ls + 1 + Lsn);
                Lsn = unique(Ls + 1, Ls + 1 + Lsn) - Ls - 1;
                for (int i = 1; i <= n; i++)
                    a[i] = lower_bound(Ls + 1, Ls + 1 + Lsn, a[i]) - Ls;
            </script>
        </codeblock>
    </section>
</section>
