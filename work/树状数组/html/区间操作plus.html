    <section>
        <h2>区间操作plus</h2>
        <p>给定一个 $n$ 个元素的数组 $A_1,A_2...A_n$，你的任务是设计一种数据结构，支持以下两种操作：</p>
        <ul>
            <li class="fragment"><code>Add(l, r, d)</code>：让 $A_l,A_{l+1}...A_r$ 的数值增加 $d$</li>
            <li class="fragment"><code>Query(l, r)</code>：求 $S_l+S_{l+1}+...+S_r$ 的和</li>
        </ul>
        <p class="fragment">如何才能让 $Add$ 和 $Query$ 都快速完成呢？</p>
    </section>
