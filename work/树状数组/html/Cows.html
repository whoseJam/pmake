    <section>
        <h2>Cows</h2>
        <p>如果 $S_i\le S_j$ 且 $E_j\le E_i$......</p>
        <p class="fragment">则除了 $S_i=S_j$ 且 $E_i=E_j$ 这种情况，其余情况一定有：
            $$
            E_i-S_i\gt E_j-S_j
            $$
        </p>
        <p class="fragment">特判掉全等的情况后，按照夜空星辰的做法做即可</p>
