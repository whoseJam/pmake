    <section>
        <h2>可持久化Trie</h2>
        <p>这里给出可持久化01Trie的实现：</p>
        <pre><code data-trim data-line-numbers class="cpp"><script type="text/template">
            void insert(int & x, int last, int v, int k) {
                t[x = ++tot] = t[last]; t[x].siz++;
                if (k == -1) return;
                int dir = (v >> k) & 1;
                insert(t[x].ch[dir], t[last].ch[dir], v, k - 1);
            }
        </script></code></pre>
