    <problem data-src="http://43.143.204.105/problem/912"></problem>
    <section>
        <h2>百慕大三角</h2>
        <p>考虑如何统计合法的三角形个数</p>
    </section>
    <section>
        <h2>百慕大三角</h2>
        <p>合法三角形=存在某边平行于 $x$ 轴的三角形+存在某边平行于 $y$ 轴的三角形-直角三角形</p>
    </section>
    <section>
        <h2>百慕大三角</h2>
        <p>
            $$
            \begin{aligned}
            red&=\sum_{y=1}^n\sum_{l=1}^n\sum_{r=l+1}^n (n^2-n)
            \end{aligned}
            $$
        </p>
    </section>
    <section>
        <h2>百慕大三角</h2>
        <p>
            $$
            \begin{aligned}
            orange&=\sum_{y=1}^n\sum_{l=1}^n\sum_{r=l+1}^n (n-1)
            \end{aligned}
            $$
        </p>
    </section>
