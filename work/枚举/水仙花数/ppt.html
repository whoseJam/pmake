    <section>
        <h2>水仙花数</h2>
        <p>求所有的三位数 $\overline{abc}$，满足
            $$
            a^3+b^3+c^3=\overline{abc}
            $$
        </p>
    </section>
    <section>
        <h2>水仙花数</h2>
        <p>枚举空间显然是 $[100,999]$</p>
        <p class="fragment quote">如何对每个数字进行检查</p>
        <p class="fragment">假设想要对 $456$ 检查...</p>
        <iframe data-animation="./取数.js" class="fragment"
            style="width: 1000px; height: 150px;"></iframe>
        <codeblock class="fragment">
            <script type="text/template">
                int sum(int x) {
                    int ans = 0;
                    while (x) {
                        int r = x % 10;
                        ans += r * r * r;
                        x /= 10;
                    }
                    return ans;
                }
            </script>
        </codeblock>
    </section>
