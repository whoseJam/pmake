<section>
    <section>
        <h1>DFS概述</h1>
        <p>一种<b>搜索深度优先</b>的搜索策略</p>
    </section>
    <section>
        <h2>深度优先</h2>
        <p>假设有这么一张搜索图</p>
        <iframe data-animation="./搜索图.js"
            data-viewBox="0 0 400 250"
            style="width: 1000px; height: 300px;"></iframe>
        <ul>
            <li class="fragment"><b>如果玩家一条路点到黑，直到通关为止</b>：这就是深度优先</li>
            <li class="fragment"><b>如果玩家左点一下，右点一下</b>：这就是广度优先</li>
        </ul>
    </section>
    <section>
        <h2>深度优先的好处</h2>
        <ol>
            <li>代码简单</li>
            <li>省空间</li>
        </ol>
    </section>
    <section>
        <h2>如何保存搜索树</h2>
        <p>之前我们一直单用一个数字就表示了搜索图中的<b>场景</b>，但一个场景实际上可能是一个<b>很复杂的对象</b></p>
        <iframe data-animation="./复杂的搜索树.js" class="fragment"
            style="width: 1000px; height: 250px;"></iframe>
        <codeblock class="fragment" style="margin-top: -20px;">
            <script type="text/template">
                struct Scene { // 保存场景的结构体
                    int v[3][3];
                }S[N];
                void build(int x, Scene s) {
                    S[x] = s;
                    for (Scene t : s 的所有后继场景) {
                        int childId = ++tot; // 为后继场景分配一个编号
                        link(x, childId);    // 连边
                        build(childId, t);   // 递归构建后继场景
                    }
                }
            </script>
        </codeblock>
        <p class="fragment"><b>当搜索树比较大，场景比较复杂的情况下，空间或许吃不消</b></p>
    </section>
    <section>
        <h2>如何保存搜索树</h2>
        <p>但深度优先搜索可以避免保存搜索树</p>
        <iframe data-animation="./DFS省空间.js"
            style="width: 1000px; height: 300px;"></iframe>
    </section>
</section>
