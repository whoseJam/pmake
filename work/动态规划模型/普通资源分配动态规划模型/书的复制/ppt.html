    <problem data-problemset="luogu" data-problemid="P1281"></problem>
    <section>
        <h2>书的复制</h2>
        <p>我们需要把一个序列划分成不超过 $k$ 份，使得价值最大的每份价值尽可能小</p>
        <ul>
            <li class="fragment">序列划分，本质上是在选子序列<span class="fragment">——子序列动态规划模型</span></li>
            <li class="fragment">划分段数不超过 $k$，本质上是在分配资源，不能分配超过 $k$ 个单位的资源<span class="fragment">——普通资源分配动态规划模型</span></li>
        </ul>
        <p class="fragment">把两个动态规划模型组合起来...</p>
        <p class="fragment">
            设 $f(i,j)$ 表示把前 $i$ 个元素划分成 $j$ 份，最大那份价值最小是多少
        </p>
        <p class="fragment">
            $$
            f(i,j)=\mathop{min}\limits_{k\lt i} \{max(f(k,j-1), S_{k+1,i}) \}
            $$
        </p>
    </section>
</section>
