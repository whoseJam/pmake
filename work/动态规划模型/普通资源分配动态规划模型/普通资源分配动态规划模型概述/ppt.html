<section>
    <section>
        <h1>普通资源分配动态规划模型</h1>
        <p>分东西</p>
    </section>
    <section>
        <h2>普通资源分配动态规划模型</h2>
        <p>描述要把某种资源分配出去，这种资源数量很多，不过每个资源之间是<b>完全相同</b>的</p>
        <div class="fragment quote">
            <h3>并非某种</h3>
            <span>有的时候可能要把两种资源分配出去，有的时候是三种，还有可能有四种，四种以上就少见了</span>
        </div>
    </section>
    <section>
        <h2>普通资源分配动态规划模型</h2>
        <p>我们通常会把资源的存量塞给动态规划的状态</p>
        <p class="fragment quote">当然你要把资源已分配量塞给动态规划也行，我们知道
            $$
            资源总量=资源存量+资源分配量
            $$
        </p>
        <p class="fragment">那么什么是资源呢？</p>
        <ul>
            <li class="fragment">背包问题中，背包的体积就是资源<span class="fragment">，我们需要消耗资源来获取收益</span></li>
            <li class="fragment">用火柴凑出最大的数字，使用的火柴就是资源<span class="fragment">，我们需要消耗资源来凑出数字</span></li>
        </ul>
    </section>
</section>
