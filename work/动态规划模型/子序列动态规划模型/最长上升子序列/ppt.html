    <problem data-problemset="luogu" data-problemid="B3637"></problem>
    <section>
        <h2>最长上升子序列</h2>
        <p>给出一个由 $n$ 个正整数组成的序列，请输出这个序列的<b>最长上升子序列</b>的长度</p>
        <p class="fragment">最长上升子序列是指，从原序列中按顺序取出一些数字排在一起，这些数字是逐渐增大的</p>
        <div class="fragment quote">
            $[1,3,6,7]$ 是 $[1,5,3,5,6,5,8,7]$ 的一个上升子序列
        </div>
    </section>
    <section>
        <h2>最长上升子序列</h2>
        <p>设 $f(i)$ 表示以 $a_i$ 为结尾的最长上升子序列的长度</p>
        <p class="fragment">
            $$
            f(i)=\mathop{max}_{\begin{aligned}j&\le i\\ a_j&\lt a_i\end{aligned}}\{f(j)\}+1
            $$
        </p>
        <iframe data-animation="./最长上升子序列.js" class="fragment"
            style="width: 1000px; height: 450px;"></iframe>
    </section>
</section>
