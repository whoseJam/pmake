        <h1>子序列动态规划模型</h1>

    <section>
        <h2>子序列动态规划模型</h2>
        <p>这类模型尝试在一个序列中取出一个子序列</p>
        <iframe data-animation="./状态设置.js"
            style="width: 1000px; height: 200px;"></iframe>
        <p class="fragment">状态往往考虑序列的最末尾是序列中的哪个位置，设 $f(i)$ 表示子序列最后一个元素下标为 $i$ 时的<b>子序列最大值/最小值/方案数...</b><span class="fragment">，然后通过枚举子序列倒数第二个元素是谁进行转移</span></p>
        <p class="fragment">
            $$
            f(j)\stackrel{更新}{\rightarrow} f(i),j\lt i
            $$
        </p>
        <p class="fragment">优化可以考虑从减少倒数第二个位置的可能数量/加速转移过程两个角度思考</p>
    </section>
</section>
