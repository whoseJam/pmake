        <h2>网路</h2>
        <p>我们把单向的网络连接当作有向边</p>
        <ol>
            <li>至少要给多少个学校传软件，才能使得所有学校都收到软件</li>
            <li>若给任意一个学校传递软件，都能使得所有学校收到软件，至少需要再加多少条网络连接</li>
        </ol>
        <p class="fragment">第一个问题和“消息的传递”没有区别，在此略过，我们主要考虑第二个问题怎么做</p>

    <section>
        <h2>网络</h2>
        <p>我们还是先对原图缩点，缩点之后，第二个问题可以被等价描述为，给你一个DAG，你需要加多少条额外边，才能让DAG变成一个强连通图</p>
        <p class="fragment">设DAG中入度为 $0$ 的点的数量为 $i_0$，出度为 $0$ 的点的数量为 $o_0$</p>
        <p class="fragment">则答案为 $Ans=max(i_0,o_0)$</p>
