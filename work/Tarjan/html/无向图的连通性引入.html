<section>
    <section>
        <h1>割点和割边</h1>
        <p>无向图的连通性从这里出发</p>
    </section>
    <section>
        <h2>无向图的连通性</h2>
        <p>在研究无向图的连通性时，我们比较关心那些<b>脆弱的节点</b>或者<b>脆弱的连边</b></p>
    </section>
    <section>
        <h2>割点</h2>
        <p>所谓脆弱的节点，就是这个节点被删除后，原图中本来相连的一个连通块，会被分裂成两个或多个不相连的连通块</p>
        <p class="fragment">而这种特殊的点就叫做<b>割点</b></p>
        <iframe
            style="min-width: 1000px; min-height: 400px;"
            data-src="./animation/割点定义.html"></iframe>
    </section>
    <section>
        <h2>割边</h2>
        <p>所谓脆弱的边，就是这个边被删除后，原图中本来相连的一个连通块，会被分裂成两个不相连的连通块</p>
        <p class="fragment">而这种特殊的边就叫做<b>割边</b>，也可以叫做<b>桥</b></p>
        <iframe
            style="min-width: 1000px; min-height: 400px;"
            data-src="./animation/割边定义.html"></iframe>
    </section>
    <section>
        <h2>双连通性</h2>
        <p>如果一张无向图不存在割点，那么我们说这张无向图是<b>点双连通</b>的</p>
        <p>如果一张无向图不存在割边，那么我们说这张无向图是<b>边双连通</b>的</p>
    </section>
</section>
