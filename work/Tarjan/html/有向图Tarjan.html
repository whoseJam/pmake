<section>
    <section>
        <h1>有向图中Tarjan算法的应用</h1>
    </section>
    <section>
        <h2>Tarjan</h2>
        <p>Tarjan算法尝试将有向图中的边分成三类：</p>
        <ul class="fragment">
            <li>父子边：判断方法和无向图一样</li>
            <li>返祖边：判断方法和无向图一样</li>
            <li>横叉边：如果 $(u,v)$ 这条有向边不是父子边，且指向的点 $v$，不再DFS树上 $u$ 到根的路径上（即不是返祖边），那么这条边就是横叉边</li>
        </ul>
        <p class="fragment">我们用一个栈来判断某条边是不是横叉边</p>
        <iframe data-src="./animation/有向图边分类.html" class="fragment"
            style="width: 1000px; height: 400px;">
        </iframe>
    </section>
    <section>
        <h2>Tarjan</h2>
        <codeblock style="height: 465px;">
            <script type="text/template">
                void Tarjan(int u) {
                    dfn[u] = low[u] = ++tot;
                    s.push(u); ins[u] = 1; // 将 u 入栈
                    for (int i = h[u]; i; i = l[i].Nxt) {
                        int v = l[i].to;
                        if (dfn[v] == 0) { // (u, v) 是父子边
                            Tarjan(v);
                            low[u] = min(low[u], low[v]);
                        }
                        else if (ins[v]) low[u] = min(low[u], dfn[v]); // (u, v) 是返祖边
                    }
                    if (dfn[u] == low[u]) { // u 是一个强连通分量的顶端
                        SCC++;
                        while (true) { // 把栈中属于该强连通分量的点全部弹出
                            int t = s.top();
                            s.pop();
                            bel[t] = SCC;
                            ins[t] = 0;
                            if (t == u) break;
                        }
                    }
                }
            </script>
        </codeblock>
    </section>
    <section>
        <h2>Tarjan</h2>
        <p>由于经过Tarjan缩点的有向图一定是DAG，所以强连通分量经常和拓扑排序一起考，还可能捎上DAG上的动态规划</p>
    </section>
</section>
