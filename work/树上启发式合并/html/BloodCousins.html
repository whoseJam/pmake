    <problem data-src="http://43.143.204.105/problem/3"></problem>
    <section>
        <h2>Blood Cousins</h2>
        <p class="quote">树上启发式合并能解决子树内的统计问题，但是这个题是找一个节点与多少个节点拥有共同的 $k$ 级祖先，应该如何转换呢？</p>
        <p class="fragment">想要找一个节点 $u$ 与多少个节点拥有共同的 $k$ 级祖先，那么可以转化为先找到 $u$ 的 $k$ 级祖先 $g$（使用倍增），再找这个 $g$ 有多少个 $k$ 级后代</p>
    </section>
    <section>
        <h2>Blood Cousins</h2>
        <p class="quote">如何暴力统计某子树内的 $k$ 级后代数量呢？</p>
        <iframe data-animation="./animation/BloodCousins.html" class="fragment"
            style="width: 1000px; height: 400px;" rate="1.01"></iframe>
        <codeblock class="fragment">
            <script type="text/template">
                void AddNode(int u) {
                    count[dep[u]]++;
                }
            </script>
        </codeblock>
    </section>
    <section>
        <h2>Blood Cousins</h2>
        <p>然后改造为树上启发式合并</p>
        <codeblock style="height: 465px;">
            <script type="text/template">
                void Dsu(int u, int f) {
                    for (int i = h[u], v; i; i = l[i].Nxt) {
                        v = l[i].to;
                        if (v != f && v != son[u]) {
                            Dsu(v, u);
                            Remove(v, u);
                        }
                    }
                    if (son[u]) Dsu(son[u], u);
                    for (int i = h[u], v; i; i = l[i].Nxt) {
                        v = l[i].to;
                        if (v != f && v != son[u]) {
                            Add(v, u);
                        }
                    }
                    AddNode(u);
                    for (auto & query: queries[u]) {
                        int id = query.id;
                        int k = query.k;
                        Ans[id] = count[dep[u] + k] - 1;
                    }
                }
            </script>
        </codeblock>
    </section>
