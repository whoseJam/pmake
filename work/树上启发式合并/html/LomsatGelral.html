    <section>

    <problem data-src="http://43.143.204.105/problem/5"></problem>
    <section>
        <h2>Lomsat Gelral</h2>
        <p class="quote">如何暴力统计某子树内的<b>主要颜色编号和</b>？</p>
        <iframe data-animation="./animation/树上数颜色.html" class="fragment"
            style="width: 1000px; height: 300px;"></iframe>
        <codeblock class="fragment">
            <script type="text/template">
                void AddCol(ll c) {
                    colCount[c]++;
                    if (mxCol < colCount[c]) {
                        mxCol = colCount[c];
                        smCol = c;
                    } else if (mxCol == colCount[c]) {
                        smCol += c;
                    }
                }
            </script>
        </codeblock>
    </section>
    <section>
        <h2>Lomsat Gelral</h2>
        <p>然后改造为树上启发式合并</p>
        <codeblock>
            <script type="text/template">
                void Dsu(ll u, ll f) {
                    for (ll i = h[u], v; i; i = l[i].Nxt) {
                        v = l[i].to;
                        if (v != f && v != son[u]) {
                            Dsu(v, u);
                            Remove(v, u);
                            mxCol = smCol = 0;
                        }
                    }
                    if (son[u]) Dsu(son[u], u);
                    for (ll i = h[u], v; i; i = l[i].Nxt) {
                        v = l[i].to;
                        if (v != f && v != son[u]) {
                            Add(v, u);
                        }
                    }
                    AddCol(col[u]);
                    Ans[u] = smCol;
                }
            </script>
        </codeblock>
    </section>
</section>
