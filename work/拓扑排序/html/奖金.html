    <section>
        <h1>奖金</h1>
    </section>
    <problem data-source="https://oj.aicoders.cn/problem/1865"></problem>
    <section>
        <h2>奖金</h2>
        <p>我们可以设 $f(u)$ 表示 $u$ 这个人至少要发多少奖金</p>
        <p class="fragment">假设 $a$ 和 $b$ 是两个人，其中要求 $a$ 的奖金一定要比 $b$ 多</p>
        <p class="fragment">那么在 $b$ 的奖金确定之前，$a$ 的奖金一定确定不下来</p>
        <p class="fragment">所以我们连一条 $b\rightarrow a$ 的边</p>
        <iframe data-animation="./animation/奖金.html" class="fragment"
            style="width: 1000px; height: 300px;"></iframe>
        <p class="fragment">
            $$
            f(u)=\mathop{max}_{(v,u)\in E}\{f(v)+1\}
            $$
        </p>
    </section>
    <section>
        <h2>奖金</h2>
        <codeblock>
            <script type="text/template">
                void Toposort() {
                    queue < int > q;
                    for (int i = 1; i <= N; i++)
                        if (Ind[i] == 0) q.push(i);
                    while (q.size()) {
                        int u = q.front(); q.pop(); vis++;
                        for (int i = h[u]; i; i = l[i].nextLine) {
                            int v = l[i].to;
                            m[v] = max(m[v], m[u] + 1);
                            Ind[v]--;
                            if (Ind[v] == 0) q.push(v);
                        }
                    }
                }
            </script>
        </codeblock>
    </section>
</section>
