    <section>
        <h1>最长路</h1>
        <p>有向无环图最长路</p>
    </section>
    <section data-background-iframe="http://43.143.204.105/problem/148" data-background-interactive>
    </section>
    <section>
        <h2>最长路</h2>
        <p>设 $dis(u)$ 表示，走到节点 $u$ 的最长路</p>
        <iframe data-src="./animation/最长路.html" class="fragment"
            style="width: 1000px; height: 300px;"></iframe>
        <p class="fragment">
            $$
            dis(v)=\mathop{max}_{(u,v)\in E}\{dis(u)+w(u,v)\}
            $$
        </p>
    </section>
    <section>
        <h2>最长路</h2>
        <p>需要处理的细节：</p>
        <ul>
            <li class="fragment">可能有多个入度为 $0$ 的点</li>
            <li class="fragment">起点入度不一定为 $0$</li>
        </ul>
        <codeblock class="fragment">
            <script type="text/template">
                void Toposort() {
                    queue < int > q;
                    for (int i = 1; i <= n; i++) dis[i] = -inf;
                    dis[1] = 0;
                    for (int i = 1; i <= n; i++)
                        if (!Ind[i]) q.push(i);
                    while (q.size()) {
                        int u = q.front(); q.pop();
                        for (int i = h[u], v; i; i = l[i].Nxt) {
                            v = l[i].to;
                            if (dis[u] != -inf) dis[v] = max(dis[v], dis[u] + l[i].val);
                            if (!(--Ind[v])) q.push(v);
                        }
                    }
                }
            </script>
        </codeblock>
    </section>
</section>
