    <problem data-src="https://www.luogu.com.cn/problem/AT_chokudai_S001_h"></problem>
    <section>
        <h2>树状数组优化LIS</h2>
        <codeblock>
            <script type="text/template">
                scanf("%d", & n);
                ll ans = 0;
                for (int i = 1; i <= n; i++) {
                    scanf("%d", & x);
                    f[i] = T.ask(x - 1) + 1;
                    T.upd(x, f[i]);
                }
                for (int i = 1; i <= n; i++)
                    ans = max(ans, f[i]);
                printf("%lld", ans);
            </script>
        </codeblock>
