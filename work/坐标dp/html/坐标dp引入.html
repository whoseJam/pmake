    <section>
        <h1>坐标dp</h1>
    </section>
    <section>
        <h2>坐标dp</h2>
        <p>坐标dp，顾名思义，是一种和<b>坐标位置</b>有很大关系的dp</p>
        <p class="fragment">它的状态划分和<b>坐标维度</b>有关，一般在二维坐标系，常常 $(i,j)$ 表示状态</p>
        <p class="fragment">
            当然，坐标系不一定非得是规规矩矩的 $n\times m$ 的矩阵，还有可能是：
            <ul>
                <li class="fragment">倒三角</li>
                <li class="fragment">正三角</li>
                <li class="fragment">$2\times n$ 的狭长的矩形</li>
                <li class="fragment">......</li>
            </ul>
        </p>
    </section>
</section>
