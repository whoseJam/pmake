<section>
    <section>
        <h1>过河卒</h1>
    </section>
    <problem data-src="http://43.143.204.105/problem/955"></problem>
    <section>
        <h2>过河卒</h2>
        <picture data-src="./image/过河卒.png"></picture>
        <p>给定一张象棋图（上面某位置放了一匹<b>不会移动的</b>敌对马），现在一个<b>过河卒</b>想要从 $(1,1)$ 走到 $(n,m)$ 点，要求：</p>
        <ul>
            <li class="fragment">只能向下或者向右行走</li>
            <li class="fragment">不能经过马或者马能攻击到的地点</li>
        </ul>
        <p class="fragment">求从起点到终点的路径条数</p>
    </section>
    <section>
        <h2>过河卒</h2>
        <iframe data-animation="./animation/过河卒.html"
            style="width: 1000px; height: 300px;"></iframe>
        <p class="fragment">
            设 $f(i,j)$ 表示从起点走到 $(i,j)$ 的方案数
        </p>
        <p class="fragment">
            若 $(i,j)$ 不是马能攻击到的点，则：
            $$
            f(i,j)=f(i-1,j)+f(i,j-1)
            $$
        </p>
        <p class="fragment">否则，$f(i,j)=0$</p>
    </section>
    <section>
        <h2>过河卒</h2>
        <p>
            $$
            f(i,j)=f(i-1,j)+f(i,j-1)
            $$
        </p>
        <codeblock>
            <script type="text/template">
                if (dp[1][1] != -inf) dp[1][1] = 1;
                for (ll i = 1; i <= n; i++) {
                    for (ll j = 1; j <= m; j++) {
                        if (dp[i][j] == -inf) continue;
                        if (i == 1 && j == 1) continue;
                        ll ans = 0;
                        if (dp[i - 1][j] != -inf) ans += dp[i - 1][j];
                        if (dp[i][j - 1] != -inf) ans += dp[i][j - 1];
                        dp[i][j] = ans;
                    }
                }
            </script>
        </codeblock>
        <p class="fragment">Attention，被马攻击到的地方不能参与转移</p>
    </section>
</section>
