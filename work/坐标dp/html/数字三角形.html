    <section>
        <h2>数字三角形</h2>
        <p>
            $$
            f(i,j)=max\{f(i-1,j-1),f(i-1,j)\}+a_{i,j}
            $$
        </p>
        <p class="fragment">递推：</p>
        <codeblock class="fragment">
            <script type="text/template">
                int Solve() {
                    for (int i = 1; i <= n; i++) {
                        for (int j = 1; j <= i; j++) {
                            F[i][j] = A[i][j] + max(F[i - 1][j - 1], F[i - 1][j]);
                        }
                    }
                    int ans = 0;
                    for (int j = 1; j <= n; j++) ans = max(ans, F[n][j]);
                    return ans;
                }
            </script>
        </codeblock>
        <p class="fragment">记忆化搜索：</p>
        <codeblock class="fragment">
            <script type="text/template">
                int Dfs(int i, int j) {
                    if (i == 0 || j == 0) return 0;
                    if (F[i][j] != -1) return F[i][j];
                    F[i][j] = A[i][j] + max(Dfs(i - 1, j - 1), Dfs(i - 1, j));
                    return F[i][j];
                }
            </script>
        </codeblock>
    </section>
