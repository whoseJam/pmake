        <p class="fragment" style="margin-top: -20px;">但只要我们稍微加一个剪枝......</p>

            data-viewBox="0 0 1000 220"

        <p class="fragment">假设前面构造出的数列之和为 $sum$，当前打算放的数字是 $i$，之后还有 $t$ 个位置需要放数字</p>
        <p class="fragment">$$sum+it\lt n$$</p>

    <section>
        <h2>数的划分</h2>
        <codeblock>
            <script type="text/template">
                void Dfs(int last, int sum, int cur) {
                    if (cur == k) {
                        if (sum == n) cnt++;
                        return;
                    }
                    int t = k - cur;
                    for (int i = last; sum + i * t <= n; i++)
                        Dfs(i, sum + i, cur + 1);
                }
            </script>
        </codeblock>
