        <h1>Lucas定理</h1>
    </section>
    <section>
        <h2>Lucas定理</h2>
        <p>假设我们欲求 $C_n^m\% P$ 的值，其中 $n$ 和 $m$ 很大，但是 $P$ 是一个<b>不太大的质数</b></p>
        <p class="fragment">
            $$
            C_n^m=C_{n\%P}^{m\%P}\times C_{n/P}^{m/P} \% P
            $$
        </p>
        <codeblock class="fragment">
            <script type="text/template">
                int Lucas(int n, int m) {
                    if (m == 0) return 1;
                    int ans = C(n % P, m % P) * Lucas(n / P, m / P) % P;
                    return ans;
                }
            </script>
        </codeblock>
    </section>
</section>
