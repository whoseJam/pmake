    <section>
        <h1>组合数</h1>
        <p>$C_n^m$</p>
    </section>
    <section>
        <h2>组合数</h2>
        <p>从 $n$ 个不同的元素中取出 $m$ 个组成一个集合（不考虑顺序），产生的不同集合数量为：
            $$
            C_n^m=\frac{n!}{m!(n-m)!}=\frac{A_n^m}{m!}
            $$
        </p>
        <p class="fragment">$A_n^m=C_n^m\times m!$ 可以从组合意义上去理解，从 $n$ 个元素中选出 $m$ 个元素搞排列，等价于先从 $n$ 个元素中选出 $m$ 个元素出来组成一个集合，再把这个集合中的元素拿出来做排列</p>
    </section>
</section>
