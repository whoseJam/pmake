    <problem data-src="http://43.143.204.105/problem/927"></problem>
    <section>
        <h2>青原樱</h2>
        <p>一排 $n$ 个位置可以种树</p>
        <p class="fragment">总共有 $m$ 支幼苗</p>
        <p class="fragment">需要保证任意两支幼苗之间至少存在<b>一个不种树的空位置</b></p>
        <p class="fragment">求有多少种种树方案</p>
    </section>
    <section>
        <h2>青原樱</h2>
        <p>把 $m$ 棵树挪走，则剩下 $n-m$ 个坑</p>
        <p class="fragment">我们尝试把 $m$ 棵树插入到 $n-m+1$ 个空位上去</p>
        <p class="fragment">答案即为 $C_{n-m+1}^mA_m^m$</p>
    </section>
</section>
