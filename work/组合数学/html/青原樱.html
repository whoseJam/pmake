        <h2>青原樱</h2>
        <p>把 $m$ 棵树挪走，则剩下 $n-m$ 个坑</p>
        <p class="fragment">我们尝试把 $m$ 棵树插入到 $n-m+1$ 个空位上去</p>
        <p class="fragment">答案即为 $C_{n-m+1}^mA_m^m$</p>
