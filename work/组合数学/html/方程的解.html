    <problem data-src="http://43.143.204.105/problem/269"></problem>
    <section>
        <h2>方程的解</h2>
        <p>
            求解：
            $$
            a_1+a_2+...+a_{k-1}+a_k=g(x)
            $$
            这个方程有多少个整数解
        </p>
        <p class="fragment">其中 $g(x)=x^x\ mod\ 1000$</p>
        <p class="fragment quote">
            这里的 $a_1,a_2...a_k$ 是未知数，$x$ 是给出的已知数
            <span class="fragment">，那么 $g(x)$ 就当作一个常数 $C$ 就行了</span>
        </p>
        <p class="fragment">如果我们认为每个 $a_i$ 是一个盒子，那么就是在把 $g(x)$ 个元素放进这 $k$ 个盒子，求方案数</p>
        <p class="fragment">用隔板法即可</p>
    </section>
</section>
