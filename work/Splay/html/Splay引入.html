    <section>
        <h2>Splay</h2>
        <p>Splay是一种基于<b>均摊时间复杂度</b>的平衡树</p>
        <p class="fragment">也就是说，Splay并不能保证任何时刻，这棵二叉查找树都长得非常均衡，但是能保证，如果进行 $m$ 次操作，当 $m\rightarrow +\infty$ 的时候，这 $m$ 次操作的总时间复杂度是 $O(mlogn)$ 的，均摊到单次操作的时间复杂度为 $O(logn)$</p>
        <p class="fragment">Splay的核心思想是通过旋转操作进行<b>自我调整</b>，从而获得均摊较低的时间复杂度</p>
        <p class="fragment"><del>由于Splay的时间复杂度的证明过于复杂且没有什么参考价值，所以本篇不会涉及到Splay的时间复杂度的证明</del></p>
