<section>
    <section>
        <h1>lcm</h1>
    </section>
    <section>
        <h2>lcm</h2>
        <p>两个数字 $a$ 和 $b$ 所共有的倍数，就是 $a$ 和 $b$ 的公倍数</p>
        <ul>
            <li class="fragment">$4$ 和 $6$ 的公倍数有 $12,24,36,48......$</li>
            <li class="fragment">容易发现两个数字的公倍数有无穷多个</li>
            <li class="fragment">我们关注其中最小的那个公倍数 $x$，这个最小的公倍数就是 $a$ 和 $b$ 的<b>最小公倍数</b></li>
            <li class="fragment">其他公倍数一定是最小公倍数 $x$ 的整数倍</li>
        </ul>
    </section>
    <section>
        <h2>lcm</h2>
        <p>一句话解决lcm：</p>
        <p>
            $$
            lcm(a,b)=\frac{ab}{gcd(a,b)}
            $$
        </p>
    </section>
</section>
