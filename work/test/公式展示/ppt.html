<section>
    <section>
        <h2>单行公式</h2>
        <p>
            $$
            a^2=b^2+c^2
            $$
        </p>
    </section>
    <section>
        <h2>多行公式</h2>
        <p>
            $$
            a^2=b^2+c^2 \\
            c^2=a^2-b^2
            $$
        </p>
    </section>
    <section>
        <h2>复杂公式</h2>
        <p class="math-fragment">
            $$
            \begin{aligned}
            \sum_{i=1}^ngcd(i,n)&=\sum_{i=1}^n\sum_{d|gcd(i,n)}\varphi(d) \\
            &=\sum_{d|n}\varphi(d)\sum_{d|i}1 \\
            &=\sum_{d|n}\varphi(d)\frac n d
            \end{aligned}
            $$
        </p>
    </section>
</section>
