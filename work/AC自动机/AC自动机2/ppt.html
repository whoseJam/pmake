    <section>
        <h2>AC自动机2</h2>
        <p>相比于前一题，稍微改改打标记的过程即可</p>
        <codeblock>
            <script type="text/template">
                int query(string& s) {
                    int ans = 0, u = 1;
                    for (int i = 0, dir; i < s.length(); i++) {
                        dir = s[i] - 'a';
                        while (u && !ch[u][dir]) u = fa[u];
                        if (ch[u][dir]) u = ch[u][dir];
                        else u = 1;
                        // 对 fail 链上的每个节点做标记
                        for (int f = u; f; f = fa[f]) vis[f]++;
                    }
                    // 统计 flg = 1（是终止节点）的节点的 vis 最大值
                    for (int i = 2; i <= tot; i++)
                        if (flg[i]) ans = max(ans, vis[i]);
                    return ans;
                }
            </script>
        </codeblock>
