    <section>
        <h2>病毒</h2>
        <p>给定 $n$ 个病毒代码（01串），你需要判断能否找到一个长度无限的<b>安全序列</b>（01序列），使得这个序列中<b>不存在任何病毒代码</b></p>
        <p class="fragment quote">如果我们把这 $n$ 个病毒代码建成一个Trie图，找得到长度无限的<b>安全序列</b>的Trie图应该有什么性质呢？</p>
    </section>
    <section>
        <h2>病毒</h2>
        <p>如果我们把所有的病毒代码建立成一个Trie图，能找到无限长的安全序列意味着图中存在一个<b>不含终止点的环</b></p>
        <div style="display: flex;">
            <div style="text-align: center;">
                <span>$\{01,11,000\}$</span>
                <iframe data-animation="./无环.js"
                    style="width: 1000px; height: 400px;"></iframe>
            </div>
            <div style="text-align: center;">
                <span>$\{011,11,000\}$</span>
                <iframe data-animation="./有环.js"
                    style="width: 1000px; height: 400px;"></iframe>
            </div>
        </div>
        <p class="fragment">判断有没有环，用DFS就行</p>
