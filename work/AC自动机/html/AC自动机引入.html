    <section>
        <h2>AC自动机</h2>
        <div>
            <div class="left">
                <codeblock style="width: 600px;">
                    <script type="text/template">
                        void build() {
                            queue < int > q;
                            q.push(1);
                            while (q.size()) {
                                int u = q.front();
                                q.pop();
                                for (int i = 0, v, f; i < 26; i++) {
                                    if (!ch[u][i]) continue;
                                    q.push(v = ch[u][i]);
                                    f = fa[u];
                                    while (f && ch[f][i] == 0) f = fa[f];
                                    if (ch[f][i]) fa[v] = ch[f][i];
                                    else fa[v] = 1;
                                }
                            }
                        }
                    </script>
                </codeblock>
            </div>
            <div class="right" style="margin-right: -50px;">
                <picture data-src="./image/构造fail指针.png"></picture>
            </div>
        </div>
    </section>
