    <section>
        <h2>Trie图</h2>
        <p>Trie图在AC自动机的基础上，尝试把所有的失配转移提前预处理出来......</p>
        <div style="display: flex; align-items: center;">
            <iframe data-animation="./Trie图.js"
                style="width: 40%; height: 450px;"></iframe>
            <codeblock style="width: 60%;">
                <script type="text/template">
                    void Build() {
                        queue< int > q; q.push(1);
                        while (q.size()) {
                            int u = q.front(); q.pop();
                            for (int i = 0, v, f, to; i < 26; i++) {
                                v = ch[u][i]; f = fail[u]; 
                                to = ch[f][i] ? ch[f][i] : 1;
                                if (!v) ch[u][i] = to;
                                else {
                                    q.push(v);
                                    fail[v] = to;
                                }
                            }
                        }
                    }
                </script>
            </codeblock>
        </div>
        <p class="fragment">相比于AC自动机，如果我们把某个字符串放到Trie图上匹配，我们只需要一直沿着ch数组走就完事了，根本不用考虑失配的情况</p>
    </section>
</section>
