<section>
    <section>
        <h1>AC自动机1</h1>
        <p>AC自动机（简单版）</p>
    </section>
    <problem data-problemset="luogu" data-problemid="P3808"></problem>
    <section>
        <h2>AC自动机1</h2>
        <p>给出 $n$ 个模式串和一个主串 $s$，统计有多少个模式串在主串里出现过</p>
        <p class="fragment">把 $n$ 个模式串建成一个AC自动机，然后把主串 $s$ 放进AC自动机里面跑匹配...</p>
        <iframe data-animation="./匹配.js" class="fragment"
            style="width: 1000px; height: 300px;"></iframe>
        <ul>
            <li class="fragment">假设目前正在对 $s[i]$ 做匹配</li>
            <li class="fragment">如果 $u\stackrel{s[i]}{\rightarrow} v$存在<span class="fragment">——直接做匹配的转移即可</span></li>
            <li class="fragment">如果 $u\stackrel{s[i]}{\rightarrow} v$不存在<span class="fragment">——通过fail指针切削字符串，换取匹配的可能性</span></li>
        </ul>
    </section>
    <section>
        <h2>AC自动机1</h2>
        <p>以 $\{aba,ba,aa,bb,b\}$ 为例</p>
        <iframe data-animation="./标记.js"
            style="width: 1000px; height: 300px;"></iframe>
        <codeblock>
            <script type="text/template">
                int query(string s) {
                    int ans = 0, u = 1;
                    for (int i = 0; i < s.length(); i++) {
                        // 移动 u，直到 u 存在字符为 s[i] 的出边，沿该出边移动
                        for (int f = u; !vis[f]; f = fa[f]) vis[f] = 1;
                    }
                    // 统计 vis = 1（被标记过） 且 flg = 1（是终止节点）的节点数量
                    for (int i = 2; i <= tot; i++)
                        if (vis[i] && flg[i]) ans++;
                    return ans;
                }
            </script>
        </codeblock>
    </section>
</section>
