        <p>FBI树是定义在一个序列上的，是一棵二叉树，每个节点可以用一个字符表示</p>
        <p class="fragment">那么可以用这么一个结构体来存储信息：</p>
        <codeblock class="fragment">
            <script type="text/template">
                struct Node {

            </script>

    <section>
        <h2>FBI树</h2>
        <p>用<code>Dfs(int l, int r)</code>来把 $[l,r]$ 转化为一棵FBI树，并且<b>返回树的根的编号</b></p>
        <codeblock class="fragment">
            <script type="text/template">
                int Dfs(int l, int r) {
                    int id = ++tot;
                    bool has0 = false, has1 = false;
                    for (int i = l; i <= r; i++) {
                        if (s[i] == '0') has0 = true;
                        if (s[i] == '1') has1 = true;
                    }
                    if (has0 && has1) d[id].typ = 'F';
                    else d[id].typ = has0 ? 'B' : 'I';
                    if (l == r) return id;
                    int mid = (l + r) >> 1;
                    d[id].ch[0] = Dfs(l, mid);
                    d[id].ch[1] = Dfs(mid + 1, r);
                    return id;
                }
            </script>
        </codeblock>
