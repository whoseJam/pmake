        <h2>二叉查找树</h2>
        <ul>
            <li>若根节点的左子树不为空，则左子树所有节点的权值均小于根节点</li>
            <li>若根节点的右子树不为空，则右子树所有节点的权值均大于根节点</li>
            <li>根的左右子树也是二叉查找树</li>
        </ul>
    </section>
