    <section>
        <h2>树的深度和宽度</h2>
        <codeblock>
            <script type="text/template">
                void Dfs(int u, int d) {
                    depth = max(depth, d);
                    int siz = 0;
                    for (int i = h[u], v; i; i = l[i].Nxt) {
                        v = l[i].to;
                        siz++;
                        Dfs(v, d + 1);
                    }
                    width = max(width, siz);
                }
            </script>
