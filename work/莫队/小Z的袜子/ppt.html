    <section>
        <h2>小Z的袜子</h2>
        <p>设 $cnt_i$ 表示查询区间内第 $i$ 类袜子的出现次数</p>
        <p>挑中两只同色袜子的概率为：
            $$
            \frac{ \sum_i{C_{cnt_i}^2} }{ C_{R-L+1}^2 }
            $$
        </p>
        <p class="fragment">用莫队维护 $\sum_iC_{cnt_i}^2$ 即可</p>
        <codeblock class="fragment">
            <script type="text/template">
                void Add(int x, int d) {
                    ans -= C(cnt[x], 2);
                    cnt[x] += d;
                    ans += C(cnt[x], 2);
                }
            </script>
        </codeblock>
    </section>
