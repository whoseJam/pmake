    <section>
        <h2>数颜色</h2>
        <codeblock>
            <script type="text/template">
                void Solve() {
                    int l = 1, r = 0, t = 0;
                    for (int i = 1; i <= qtot; i++) {
                        while (Q[i].l < l) l--, Add(a[l]);
                        while (r < Q[i].r) r++, Add(a[r]);
                        while (l < Q[i].l) Del(a[l]), l++;
                        while (Q[i].r < r) Del(a[r]), r--;
                        while (t < Q[i].t) Upd(++t, l, r, 1);  // 应用修改
                        while (Q[i].t < t) Upd(t--, l, r, -1); // 撤销修改
                        计算第 i 个询问的答案为 ans
                    }
                }
            </script>
        </codeblock>
        <codeblock class="fragment">
            <script type="text/template">
                void Upd(int t, int l, int r, int f) {
                    if (f == 1) { // 应用修改
                        if (l <= M[t].x && M[t].x <= r) {
                            M[t].pre = a[M[t].x]; // 记录一下该修改是把 a[x] 从 pre 变为 nxt
                            Del(a[M[t].x]);
                            Add(a[M[t].x] = M[t].nxt);
                        }
                    } // 撤销修改类似
                }
            </script>
        </codeblock>
