    <section>
        <h2>嗅探器</h2>
        <p>容易发现，对于生成的DFS树来说，如果 $u$ 满足 $low(u)\ge dfn(fa_u)$，并且 $u$ 位于两个信息中心在树上的最短路径上，那么 $fa_u$ 就是本题希望找到的点</p>
        <p class="fragment">换言之，设两个信息中心分别为 $a$ 和 $b$，其中 $a$ 是DFS树根上的那个点，那么 $u$ 一定位于 $b$ 沿着父子边走到 $a$ 的路径上</p>
        <p class="fragment">那我们从 $b$ 出发，一直爬父子边，把路过的满足条件的点的编号取一个最小值，就是答案了</p>
