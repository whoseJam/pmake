    <section>
        <h2>SPFA</h2>
        <p>关于SPFA......</p>
        <p class="fragment">SPFA用于求<b>单源最短路</b>，最坏时间复杂度为 $O(nm)$</p>
        <p class="fragment quote">
            SPFA可以被网格图卡到时间复杂度上限，所以建议能用Dijkstra就不用SPFA
        </p>
        <p class="fragment">
            SPFA适用于任意图
            <span class="fragment">，可以是有向图</span>
            <span class="fragment">，可以是无向图</span>
            <span class="fragment">，边权可以为正</span>
            <span class="fragment">，边权可以为负</span>
            <span class="fragment">，还能<b>判断图中是否存在负环</b></span>
        </p>
        <ul class="fragment">
            <li>有负权边不代表有负环</li>
            <li>有负环则一定有负权边</li>
        </ul>
        <iframe data-animation="./负权与负环.js" class="fragment"
            style="width: 1000px; height: 200px;" rate="1.01"></iframe>
    </section>
