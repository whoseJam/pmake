    <section>
        <h2>线段树1</h2>
        <p>题目希望我们维护一个序列，支持：</p>
        <ol>
            <li><code>1 x y k</code>：将区间 $[x,y]$ 内的每个数加上 $k$</li>
            <li><code>2 x y</code>：输出区间 $[x,y]$ 内每个数的和</li>
        </ol>
    </section>
    <section>
        <h2>线段树1</h2>
        <p>我们显然需要维护每条线段的和</p>
        <p class="fragment">由于题目要求<b>区间加法</b>，考虑如何维护懒标记</p>
        <p class="fragment quote">当一条线段的值整体增加 $d$ 时，该线段的区间和会发生怎么样的变化？</p>
        <iframe data-src="./animation/线段树1.html" class="fragment"
            style="width: 1000px; height: 200px;"></iframe>
        <codeblock class="fragment">
            <script type="text/template">
                void pushAdd(int x, int d) {
                    t[x].add += d;
                    t[x].sm += (t[x].r - t[x].l + 1) * d;
                }
            </script>
        </codeblock>
